name: Python tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library unit tests
        run: python -m unittest discover -s tests -v
      - name: Run demo CLI
        run: python scripts/normalize_libraries.py --output /tmp/normalized.csv --summary /tmp/qc_summary.json
